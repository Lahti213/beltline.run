<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #7fd3ff;
    --sky-bottom: #d9f4ff;
    --sun: #ffd23f;
    --grass: #6cc551;
    --grass-dark: #4fa63a;
    --path: #f2c48d;
    --path-edge: #d99a5b;
    --ink: #1f2a44;
    --shirt: #ff5a5f;
    --shorts: #3d5afe;
    --skin: #f5b98a;
    --cream: #fffaf0;
    --speed: 1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(var(--sky-top), var(--sky-bottom) 70%);
    overflow: hidden;
    min-height: 100svh;
  }

  /* ---------- headline ---------- */
  header {
    position: relative;
    z-index: 5;
    text-align: center;
    padding: clamp(28px, 7vh, 72px) 16px 0;
  }
  .badge {
    display: inline-block;
    background: var(--cream);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 4px 16px;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: .12em;
    text-transform: uppercase;
    box-shadow: 3px 3px 0 var(--ink);
    transform: rotate(-3deg);
  }
  h1 {
    font-family: "Lilita One", "Nunito", sans-serif;
    font-weight: 400;
    font-size: clamp(48px, 11vw, 120px);
    line-height: .95;
    margin: 14px 0 6px;
    color: var(--cream);
    -webkit-text-stroke: 3px var(--ink);
    paint-order: stroke fill;
    text-shadow: 5px 6px 0 var(--ink);
    letter-spacing: .01em;
  }
  h1 .dot { color: var(--shirt); }
  .tagline {
    font-size: clamp(17px, 2.6vw, 24px);
    font-weight: 800;
    margin: 6px 0 0;
  }
  .sub {
    font-size: clamp(14px, 1.9vw, 17px);
    margin: 6px auto 0;
    max-width: 34ch;
    opacity: .8;
  }
  .controls {
    margin-top: 18px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    font-weight: 800;
    font-size: 16px;
    color: var(--ink);
    background: var(--sun);
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 10px 18px;
    box-shadow: 4px 4px 0 var(--ink);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  button.alt { background: var(--cream); }
  button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  button:focus-visible { outline: 3px dashed var(--ink); outline-offset: 4px; }

  /* ---------- scene ---------- */
  .scene {
    position: fixed;
    inset: auto 0 0 0;
    height: 52vh;
    min-height: 300px;
    pointer-events: none;
  }
  .scene > * { position: absolute; left: 0; right: 0; }
  .scene > .runner, .scene > .bubble { right: auto; }
  .scene > .marker { left: auto; }

  .sun {
    position: fixed;
    top: 6vh; right: 8vw;
    width: clamp(70px, 11vw, 130px);
    aspect-ratio: 1;
    border-radius: 50%;
    /* the sun is a Georgia peach */
    background: radial-gradient(circle at 35% 35%, #ffd0a1, #ffa26b 55%, #ff7a59);
    border: 4px solid var(--ink);
    border-radius: 50% 50% 48% 48% / 46% 46% 54% 54%;
    box-shadow: 0 0 0 14px rgba(255, 210, 63, .35);
    animation: pulse 3s ease-in-out infinite;
  }
  .sun .leaf {
    position: absolute;
    top: -16%; left: 52%;
    width: 38%; height: 22%;
    background: #6cc551;
    border: 4px solid var(--ink);
    border-radius: 0 100% 0 100%;
    transform: rotate(-18deg);
  }
  .sun .crease {
    position: absolute;
    top: 2%; left: 44%;
    width: 18%; height: 34%;
    border-left: 4px solid rgba(31, 42, 68, .55);
    border-radius: 50%;
  }
  .sun::before, .sun::after {
    content: "";
    position: absolute;
    top: 40%;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--ink);
  }
  .sun::before { left: 30%; }
  .sun::after { right: 30%; }
  .sun span {
    position: absolute;
    left: 32%; right: 32%; top: 58%;
    height: 14%;
    border: 4px solid var(--ink);
    border-top: 0;
    border-radius: 0 0 40px 40px;
  }

  /* infinite scrolling strips: content duplicated, slide by -50% */
  .strip {
    display: flex;
    width: 200%;
    will-change: transform;
    animation: slide linear infinite;
  }
  .strip > svg { width: 50%; height: 100%; flex: none; }

  .clouds { top: -42vh; height: 26vh; }
  .clouds .strip { height: 100%; animation-duration: calc(60s / var(--speed)); }

  .skyline { bottom: 46%; height: 34%; opacity: .9; }
  .skyline .strip { height: 100%; animation-duration: calc(40s / var(--speed)); }

  .hills { bottom: 30%; height: 26%; }
  .hills .strip { height: 100%; animation-duration: calc(22s / var(--speed)); }

  .ground {
    bottom: 0; height: 34%;
    background: var(--grass);
    border-top: 4px solid var(--ink);
  }
  .path {
    bottom: 9%; height: 15%;
    background: var(--path);
    border-top: 4px solid var(--path-edge);
    border-bottom: 4px solid var(--path-edge);
    overflow: hidden;
  }
  .path::before {
    content: "";
    position: absolute;
    left: 0; top: 50%;
    width: 200%;
    height: 6px;
    margin-top: -3px;
    background: repeating-linear-gradient(90deg, var(--cream) 0 40px, transparent 40px 80px);
    animation: dash calc(.8s / var(--speed)) linear infinite;
  }
  .trees { bottom: 23%; height: 34%; }
  .trees .strip { height: 100%; animation-duration: calc(9s / var(--speed)); }

  /* ---------- runner ---------- */
  .runner {
    position: absolute;
    left: 50%;
    bottom: 13%;
    width: clamp(110px, 17vw, 170px);
    transform: translateX(-50%);
    z-index: 3;
  }
  .runner svg { width: 100%; height: auto; overflow: visible; display: block; }
  /* one full stride = --T; the two sides run half a stride apart */
  .runner { --T: calc(.72s / var(--speed)); }
  .bob { animation: bob calc(var(--T) / 2) ease-in-out infinite; }
  .runner .j { transform-box: view-box; animation-duration: var(--T); animation-iteration-count: infinite; animation-timing-function: linear; }
  .thigh   { transform-origin: 60px 98px;  animation-name: thigh; }
  .shin    { transform-origin: 60px 123px; animation-name: shin; }
  .upper   { transform-origin: 60px 58px;  animation-name: upper; }
  .fore    { transform-origin: 60px 77px;  animation-name: fore; }
  .side-b .j { animation-delay: calc(var(--T) / -2); }
  .shadow { animation: shadow calc(var(--T) / 2) ease-in-out infinite; transform-origin: 60px 172px; }
  .sweat { animation: sweat calc(1.2s / var(--speed)) ease-out infinite; opacity: 0; }
  .sweat.two { animation-delay: calc(.6s / var(--speed)); }

  .bubble {
    position: absolute;
    left: 50%;
    bottom: calc(13% + clamp(110px, 17vw, 170px) * 1.55);
    transform: translateX(10%);
    background: var(--cream);
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 8px 14px;
    font-weight: 800;
    font-size: clamp(14px, 1.8vw, 18px);
    white-space: nowrap;
    box-shadow: 3px 3px 0 var(--ink);
    z-index: 4;
    transition: opacity .25s;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 14px; bottom: -14px;
    border: 7px solid transparent;
    border-top-color: var(--ink);
    border-right-color: var(--ink);
  }

  .marker {
    position: absolute;
    right: 9vw;
    bottom: 24%;
    z-index: 2;
    width: clamp(86px, 11vw, 120px);
    text-align: center;
  }
  .marker .sign {
    background: var(--cream);
    border: 3px solid var(--ink);
    border-radius: 10px;
    padding: 6px 4px;
    font-weight: 800;
    font-size: clamp(11px, 1.3vw, 14px);
    line-height: 1.15;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .marker .sign b { display: block; font-family: "Lilita One", sans-serif; font-weight: 400; font-size: 1.7em; color: var(--shirt); }
  .marker .post { width: 8px; height: 46px; margin: 0 auto; background: var(--ink); border-radius: 0 0 4px 4px; }

  footer {
    position: fixed;
    bottom: 10px; left: 0; right: 0;
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    color: var(--cream);
    text-shadow: 1px 1px 0 var(--ink);
    z-index: 6;
  }

  @keyframes slide { to { transform: translateX(-50%); } }
  @keyframes dash { to { transform: translateX(-80px); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  /* runner faces right; positive rotation swings a limb backward.
     0% = this leg pushing off behind, 50% = this leg reaching forward to land. */
  @keyframes thigh {
    0%   { transform: rotate(32deg); }
    20%  { transform: rotate(-5deg); }
    45%  { transform: rotate(-48deg); }
    55%  { transform: rotate(-40deg); }
    100% { transform: rotate(32deg); }
  }
  @keyframes shin {          /* knee folds high on the swing-through, straightens to land */
    0%   { transform: rotate(45deg); }
    20%  { transform: rotate(105deg); }
    40%  { transform: rotate(40deg); }
    52%  { transform: rotate(8deg); }
    75%  { transform: rotate(18deg); }
    100% { transform: rotate(45deg); }
  }
  @keyframes upper {         /* arm opposite its leg: forward while that leg is back */
    0%, 100% { transform: rotate(-38deg); }
    50%      { transform: rotate(42deg); }
  }
  @keyframes fore {          /* elbow stays bent ~90°, a bit tighter on the forward swing */
    0%, 100% { transform: rotate(-105deg); }
    50%      { transform: rotate(-70deg); }
  }
  @keyframes shadow { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.75); } }
  @keyframes sweat {
    0% { opacity: 0; transform: translate(0, 0); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translate(-22px, 14px); }
  }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 10px rgba(255,210,63,.35); } 50% { box-shadow: 0 0 0 22px rgba(255,210,63,.2); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
  @media (max-width: 560px) {
    .marker { display: none; }
    .clouds { top: -50vh; height: 11vh; opacity: .9; }
    .bubble { transform: translateX(-50%); }
    .bubble::after { left: 50%; margin-left: -7px; }
  }
  @media (max-height: 640px) {
    .scene { height: 46vh; }
    .sub { display: none; }
  }
</style>
</head>

<script>
  (function () {
    var root = document.documentElement;
    var bubble = document.getElementById('bubble');
    var speeds = [1, 1.6, 2.4, 3.4];
    var speedLines = ['Almost there!', 'Tempo run!', 'Negative splits!', 'Full sprint!!'];
    var cheers = ['Peachy pace! 🍑', 'Watch out for scooters! 🛴', 'Hydrate, it\'s Hotlanta! 🥵', 'Looking strong, ATL!', 'Next stop: Ponce! 🛍️', 'Nice form!', 'Only 21.9 miles to go!', 'Who needs a site? Not me!'];
    var level = 0, cheerIdx = 0;

    function say(text) {
      bubble.style.opacity = 0;
      setTimeout(function () { bubble.textContent = text; bubble.style.opacity = 1; }, 150);
    }

    document.getElementById('faster').addEventListener('click', function () {
      level = (level + 1) % speeds.length;
      root.style.setProperty('--speed', speeds[level]);
      this.textContent = level === speeds.length - 1 ? 'Cool down 🧊' : 'Pick up the pace ⚡';
      say(speedLines[level]);
    });

    document.getElementById('cheer').addEventListener('click', function () {
      say(cheers[cheerIdx]);
      cheerIdx = (cheerIdx + 1) % cheers.length;
    });
  })();
</script>
